<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta property="og:title" content="{{ site.Title }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  {{ with site.Params.image }}<meta property="og:image" content="{{ . | absURL }}">
  <meta name="twitter:card" content="summary_large_image">{{ end }}
  <link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="icon" href="{{ "img/favicon.png" | relURL }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ "img/apple-touch-icon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "syntax.css" | relURL }}">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  {{ block "main" . }}{{ end }}
  <footer>
    <div class="wrap">
      {{ block "footer" . }}{{ end }}
    </div>
  </footer>
</body>
</html>
